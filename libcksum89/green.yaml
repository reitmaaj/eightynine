version: 1

compile_commands:
    gcc: build/gcc/compile_commands.json
    clang: build/clang/compile_commands.json

project_roots:
    - src
    - include

exclude:
    - build/**

compatibility_paths: []

pure_functions:
    - cksum89_crc32_step
    - cksum89_crc64_shift8
    - cksum89_crc64_xor
    - cksum89_inet16_fold
    - cksum89_inet16_pending_word
    - cksum89_inet16_sum_pending
    - cksum89_inet16_total
