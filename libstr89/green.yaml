version: 1

compile_commands:
    gcc: build/gcc/compile_commands.json
    clang: build/clang/compile_commands.json

project_roots:
    - src
    - include

pure_functions:
    - str89__add
    - str89__grow_cap
    - str89__overlaps
    - str89__data_ok
    - double_cap
    - too_big_to_double
    - slice_at
    - min_len
    - sign_of
    - length_order
    - alias_offset
    - shift_ptr
